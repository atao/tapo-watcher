[project]
name = "tapo-watcher"
version = "0.1.0"
description = "Move a Tapo C210 camera depending on whether phones are on the Wi-Fi"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytapo>=3.4.31",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
